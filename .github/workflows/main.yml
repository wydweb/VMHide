# 工作流名称，在GitHub Actions页面显示
name: Build Windows Executable

# 触发条件：push代码到main分支、手动触发、创建标签时执行
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发
  release:
    types: [created]

# 作业定义：在Windows环境下编译
jobs:
  build:
    # 指定运行环境为最新版Windows Server
    runs-on: windows-latest
    
    steps:
      # 步骤1：检出仓库代码到云端虚拟机
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 步骤2：安装并定位MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        id: msbuild_setup

      # 步骤3：编译项目（修复PowerShell语法错误，单行写法）
      - name: Build project
        run: |
          # 单行完整命令，避免PowerShell换行解析错误
          & "${{ steps.msbuild_setup.outputs.msbuild_path }}" "VMHide.sln" /t:Build /p:Configuration=Release /p:Platform=x64 /p:OutDir="./bin/x64/Release/" /p:WindowsTargetPlatformVersion=10.0.22621.0 /m

      # 步骤4：上传编译产物（exe文件），方便下载
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMHide-x64-Release
          path: ./bin/x64/Release/VMHide.exe
          retention-days: 90
