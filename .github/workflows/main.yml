# 工作流名称，在GitHub Actions页面显示
name: Build Windows Executable

# 触发条件：push代码到main分支、手动触发、创建标签时执行
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发
  release:
    types: [created]

# 作业定义：在Windows环境下编译
jobs:
  build:
    runs-on: windows-latest
    
    steps:
      # 步骤1：检出仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：直接使用硬编码的MSBuild路径编译（最稳定）
      - name: Build project with hardcoded MSBuild path
        run: |
          # GitHub Windows-latest环境中VS2022 Enterprise的固定MSBuild路径
          $msbuildPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          # 调用MSBuild编译项目，单行命令避免语法错误
          & $msbuildPath "VMHide.sln" /t:Build /p:Configuration=Release /p:Platform=x64 /p:OutDir="./bin/x64/Release/" /p:WindowsTargetPlatformVersion=10.0.22621.0 /m

      # 步骤3：上传编译产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMHide-x64-Release
          path: ./bin/x64/Release/VMHide.exe
          retention-days: 90
