# 工作流名称，在GitHub Actions页面显示
name: Build Windows Executable

# 触发条件：push代码到main分支、手动触发、创建标签时执行
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发
  release:
    types: [created]

# 作业定义：在Windows环境下编译
jobs:
  build:
    runs-on: windows-latest
    
    steps:
      # 步骤1：检出仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：编译项目（去掉SDK版本指定，自动适配）
      - name: Build project with auto SDK
        run: |
          # GitHub Windows-latest环境中VS2022的MSBuild固定路径
          $msbuildPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          # 核心改动：删除/p:WindowsTargetPlatformVersion参数，让MSBuild自动选SDK
          & $msbuildPath "VMHide.sln" /t:Build /p:Configuration=Release /p:Platform=x86 /p:OutDir="./bin/x86/Release/" /m

      # 步骤3：上传编译产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMHide-x86-Release
          path: ./bin/x86/Release/VMHide.dll
          retention-days: 90
